$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: soc-anomaly-training
experiment_name: soc-anomaly-detection

code: .

command: >-
  python train.py
  --data_path ${{inputs.data_path}}
  --output_path ${{outputs.model}}

inputs:
  data_path:
    type: uri_file
    path: azureml:cicids2017-monday@latest

outputs:
  model:
    type: uri_folder
    mode: rw_mount

environment: azureml:soc-anomaly-env@latest

compute: azureml:cpu-cluster
