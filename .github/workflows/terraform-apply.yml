name:  Terraform Apply — Levantar infraestructura

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "apply" para confirmar el despliegue'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Init + Plan + Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    env:
      ARM_USE_OIDC:        "true"
      ARM_USE_CLI:         "false"
      ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_ml_endpoint_url: ${{ secrets.TF_VAR_ML_ENDPOINT_URL }}
      TF_VAR_ml_endpoint_key: ${{ secrets.TF_VAR_ML_ENDPOINT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: infraestructura
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infraestructura
        run: terraform validate

      - name: Terraform Format check
        working-directory: infraestructura
        run: terraform fmt -check -recursive

      - name: Aviso — autenticación Azure requerida
        run: |
          echo " Para ejecutar Apply contra Azure es necesario:"
          echo "   1. Crear un App Registration en Azure AD"
          echo "   2. Configurar los secrets AZURE_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID"
          echo "   3. Ejecutar desde local: terraform apply"
          echo " Validación del código Terraform completada correctamente"