name:  Terraform Apply — Levantar infraestructura

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "apply" para confirmar el despliegue'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Init + Plan + Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    env:
      ARM_USE_OIDC:        "true"
      ARM_USE_CLI:         "false"
      ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_ml_endpoint_url: ${{ secrets.TF_VAR_ML_ENDPOINT_URL }}
      TF_VAR_ml_endpoint_key: ${{ secrets.TF_VAR_ML_ENDPOINT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Get OIDC Token
        id: oidc
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r '.value')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: infraestructura
        run: terraform init -backend=false
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Terraform Validate
        working-directory: infraestructura
        run: terraform validate

      - name: Terraform Plan
        working-directory: infraestructura
        run: terraform plan -var="ml_endpoint_url=${{ secrets.TF_VAR_ML_ENDPOINT_URL }}" -var="ml_endpoint_key=${{ secrets.TF_VAR_ML_ENDPOINT_KEY }}"
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Terraform Apply
        working-directory: infraestructura
        run: terraform apply -auto-approve -var="ml_endpoint_url=${{ secrets.TF_VAR_ML_ENDPOINT_URL }}" -var="ml_endpoint_key=${{ secrets.TF_VAR_ML_ENDPOINT_KEY }}"
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}