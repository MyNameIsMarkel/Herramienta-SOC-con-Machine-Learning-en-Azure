name: 🏗️ Terraform Apply — Levantar infraestructura

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "apply" para confirmar el despliegue'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Init + Plan + Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    env:
      ARM_USE_OIDC:        "true"
      ARM_USE_CLI:         "false"
      ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_ml_endpoint_url: ${{ secrets.TF_VAR_ML_ENDPOINT_URL }}
      TF_VAR_ml_endpoint_key: ${{ secrets.TF_VAR_ML_ENDPOINT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Get OIDC Token
        id: oidc
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r '.value')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: infraestructura
        run: terraform init
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Terraform Validate
        working-directory: infraestructura
        run: terraform validate

      - name: Import recursos existentes (idempotente)
        working-directory: infraestructura
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SUB: b1fca3a5-29b1-49e6-b2dd-6f9cb5dbbc2f
          RG: rg-soc-proyecto
        run: |
          import_if_missing() {
            local resource=$1
            local id=$2
            if ! terraform state show "$resource" &>/dev/null; then
              echo "Importando $resource..."
              terraform import "$resource" "$id" || echo "⚠️ No se pudo importar $resource (puede que no exista aún)"
            else
              echo "✅ $resource ya está en el state"
            fi
          }

          # ── Recursos base ──────────────────────────────────────────────────
          import_if_missing "azurerm_resource_group.soc_rg" \
            "/subscriptions/${SUB}/resourceGroups/${RG}"

          import_if_missing "azurerm_log_analytics_workspace.law" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.OperationalInsights/workspaces/log-soc-ml"

          import_if_missing "azurerm_sentinel_log_analytics_workspace_onboarding.sentinel" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.OperationalInsights/workspaces/log-soc-ml/providers/Microsoft.SecurityInsights/onboardingStates/default"

          import_if_missing "azurerm_storage_account.ml_storage" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Storage/storageAccounts/stsocsmlstorage"

          import_if_missing "azurerm_application_insights.ml_insights" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Insights/components/appi-soc-ml"

          import_if_missing "azurerm_key_vault.ml_kv" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.KeyVault/vaults/kvsocmlanom"

          import_if_missing "azurerm_machine_learning_workspace.ml_workspace" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.MachineLearningServices/workspaces/mlw-soc-anomaly"

          import_if_missing "azurerm_virtual_network.vnet" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Network/virtualNetworks/vnet-soc-ml"

          import_if_missing "azurerm_subnet.subnet_main" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Network/virtualNetworks/vnet-soc-ml/subnets/subnet-soc-main"

          # ── Logic App detección ────────────────────────────────────────────
          import_if_missing "azurerm_logic_app_workflow.soc_playbook" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-anomaly-playbook"

          import_if_missing "azurerm_logic_app_trigger_http_request.sentinel_trigger" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-anomaly-playbook/triggers/sentinel_alert"

          import_if_missing "azurerm_logic_app_action_custom.call_ml_endpoint" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-anomaly-playbook/actions/Call_ML_Endpoint"

          import_if_missing "azurerm_logic_app_action_custom.parse_ml_response" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-anomaly-playbook/actions/Parse_ML_Response"

          import_if_missing "azurerm_logic_app_action_custom.check_anomaly" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-anomaly-playbook/actions/Check_If_Anomaly"

          # ── Logic App respuesta ────────────────────────────────────────────
          import_if_missing "azurerm_logic_app_workflow.response_playbook" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-response-playbook"

          import_if_missing "azurerm_logic_app_trigger_http_request.response_trigger" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-response-playbook/triggers/incident_confirmed"

          import_if_missing "azurerm_logic_app_action_custom.block_ip_nsg" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Logic/workflows/soc-response-playbook/actions/Block_IP_NSG"

          import_if_missing "azurerm_network_security_group.soc_response_nsg" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Network/networkSecurityGroups/nsg-soc-response"

          # ── Role assignments (importar en vez de recrear) ──────────────────
          import_if_missing "azurerm_role_assignment.logic_app_sentinel_contributor" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.OperationalInsights/workspaces/log-soc-ml/providers/Microsoft.Authorization/roleAssignments/336bc74b2afc2cdcc597acdb9bfb93e2"

          import_if_missing "azurerm_role_assignment.response_network_contributor" \
            "/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Authorization/roleAssignments/e9163b5ff9143d33cea517cd66b77dff"

      - name: Terraform Plan
        working-directory: infraestructura
        run: terraform plan -out=tfplan
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Terraform Apply
        working-directory: infraestructura
        run: terraform apply -auto-approve tfplan
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Mostrar outputs
        working-directory: infraestructura
        run: terraform output
        env:
          ARM_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
