name:  Terraform Destroy — Eliminar infraestructura

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para confirmar la eliminación TOTAL'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    name: Terraform Init + Validate
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: infraestructura
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infraestructura
        run: terraform validate

      - name: Aviso — autenticación Azure requerida
        run: |
          echo " Para ejecutar Destroy contra Azure es necesario:"
          echo "   1. Crear un App Registration en Azure AD"
          echo "   2. Configurar los secrets AZURE_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID"
          echo "   3. Ejecutar desde local: terraform destroy"
          echo " Validación del código Terraform completada correctamente"